<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanity Leakage</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body class="font-[Inter] overflow-x-hidden bg-white text-black">

<!-- ATMOSPHERE + NOISE -->
<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute top-[-200px] left-[-200px] w-[600px] h-[600px] bg-black/5 blur-3xl rounded-full"></div>
  <div class="absolute bottom-[-200px] right-[-200px] w-[600px] h-[600px] bg-black/5 blur-3xl rounded-full"></div>

  <!-- grain overlay -->
  <div class="absolute inset-0 opacity-[0.03] bg-[url('https://www.transparenttextures.com/patterns/noise.png')]"></div>
</div>

<!-- NAV -->
<header class="flex justify-between items-center px-6 py-6 border-b border-black/10 backdrop-blur-xl bg-white/70 sticky top-0 z-50">

<h1 class="font-black tracking-[10px] text-sm">
SANITY LEAKAGE
</h1>

<div class="flex gap-5 text-xl items-center">

<button onclick="toggleMenu()" class="hover:scale-110 transition">☰</button>
<button onclick="toggleFav()" class="hover:scale-110 transition">♡</button>

<button onclick="toggleCart()" class="relative hover:scale-110 transition">
🛒
<span id="count" class="absolute -top-2 -right-2 bg-black text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
</button>

</div>

</header>

<!-- HERO -->
<section class="text-center py-24 relative">

<!-- animated logo -->
<img src="IMG-20260519-WA0003.jpg"
class="w-[340px] md:w-[720px] mx-auto drop-shadow-[0_40px_80px_rgba(0,0,0,0.25)] animate-[pulse_6s_ease-in-out_infinite]">

<p class="tracking-[14px] text-xs text-zinc-500 mt-8">
LIMITED ARCHIVE DROP
</p>

</section>

<!-- PRODUCT GALLERY -->
<section class="px-6">

<div class="flex gap-6 overflow-x-auto snap-x snap-mandatory scroll-smooth">

<img onclick="openImg(this.src)"
src="IMG-20260519-WA0006.jpg"
class="snap-center w-[90vw] md:w-[600px] h-[650px] object-cover rounded-[35px] shadow-2xl hover:scale-[1.03] transition duration-500 cursor-zoom-in">

<img onclick="openImg(this.src)"
src="IMG-20260520-WA0000.jpg"
class="snap-center w-[90vw] md:w-[600px] h-[650px] object-cover rounded-[35px] shadow-2xl hover:scale-[1.03] transition duration-500 cursor-zoom-in">

</div>

</section>

<!-- PRODUCT INFO -->
<section class="text-center py-16">

<h2 class="text-5xl font-black uppercase tracking-tight">
Reflective Windbreaker
</h2>

<p class="text-zinc-500 mt-3 tracking-[4px] text-sm">
R950 • SINGLE PIECE DROP
</p>

<button onclick="addToCart()"
class="mt-10 bg-black text-white px-12 py-5 rounded-full uppercase tracking-[5px] font-black hover:scale-105 hover:shadow-2xl transition">

Add To Cart

</button>

</section>

<!-- QUOTE -->
<section class="bg-black text-white py-40 text-center px-6 relative overflow-hidden">

<div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent blur-3xl"></div>

<h2 class="text-4xl md:text-6xl font-black max-w-4xl mx-auto leading-tight relative z-10">
“Built for those who exist outside the system.”
</h2>

<img src="IMG-20260519-WA0001.jpg"
class="w-28 mt-16 mx-auto opacity-70 relative z-10">

</section>

<!-- CART -->
<div id="cart"
class="fixed top-0 right-0 w-[420px] h-full bg-black text-white p-6 translate-x-full transition duration-500 z-50 flex flex-col shadow-2xl">

<div class="flex justify-between border-b border-white/10 pb-4">
<h2 class="font-bold tracking-[4px] uppercase">Basket</h2>
<button onclick="toggleCart()">X</button>
</div>

<div id="items" class="flex-1 mt-6 text-sm text-zinc-400 overflow-y-auto">
Empty
</div>

<div class="pt-4 border-t border-white/10">

<p class="mb-4">Total: R<span id="total">0</span></p>

<a id="mail"
class="block bg-white text-black text-center py-4 rounded-full font-black uppercase tracking-[3px] hover:scale-105 transition">

Checkout via Gmail

</a>

</div>

</div>

<!-- IMAGE MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center">
<img id="modalImg" class="max-w-[90%] max-h-[90%] rounded-2xl">
</div>

<script>

let cart = [];

function addToCart(){
cart.push("Reflective Windbreaker");
update();
toggleCart();
}

function remove(i){
cart.splice(i,1);
update();
}

function update(){

document.getElementById("count").innerText = cart.length;

document.getElementById("items").innerHTML =
cart.length ? cart.map((x,i)=>`
<div class="flex justify-between border-b border-white/10 py-2">
<p>${x}</p>
<button onclick="remove(${i})">x</button>
</div>
`).join("") : "Empty";

document.getElementById("total").innerText = cart.length * 950;

let body = "ORDER:\n\n" + cart.join("\n") + "\n\nTOTAL: R" + (cart.length * 950);

document.getElementById("mail").href =
"mailto:Cruzaliancy@gmail.com?subject=Order&body=" + encodeURIComponent(body);

}

function toggleCart(){
document.getElementById("cart").classList.toggle("translate-x-full");
}

function toggleFav(){
alert("Added to favorites ♡");
}

/* IMAGE ZOOM */
function openImg(src){
document.getElementById("modal").classList.remove("hidden");
document.getElementById("modalImg").src = src;
}

document.getElementById("modal").onclick = () => {
document.getElementById("modal").classList.add("hidden");
};

update();

</script>

</body>
</html>
