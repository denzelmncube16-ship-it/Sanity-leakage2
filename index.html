<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanity Leakage — Runway</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ===== RUNWAY SYSTEM ===== */
body{
overflow-x:hidden;
background:white;
color:black;
font-family:Inter;
}

/* slow reveal like runway entrance */
.runway{
opacity:0;
transform: translateY(60px);
filter: blur(10px);
transition: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.runway.show{
opacity:1;
transform: translateY(0);
filter: blur(0);
}

/* staged delay system */
.d1{ transition-delay: 0.15s; }
.d2{ transition-delay: 0.3s; }
.d3{ transition-delay: 0.45s; }

/* parallax drift */
.parallax{
transform: translateY(0px);
will-change: transform;
}

/* hide scrollbar */
::-webkit-scrollbar{ display:none; }

</style>

</head>

<body>

<!-- ATMOSPHERE -->
<div class="fixed inset-0 pointer-events-none">
<div class="absolute top-[-200px] left-[-200px] w-[700px] h-[700px] bg-black/5 blur-3xl rounded-full"></div>
<div class="absolute bottom-[-200px] right-[-200px] w-[700px] h-[700px] bg-black/5 blur-3xl rounded-full"></div>
</div>

<!-- RUNWAY HEADER -->
<header class="flex justify-between items-center px-6 py-6 border-b border-black/10 bg-white/70 backdrop-blur-xl sticky top-0 z-50 runway">

<h1 class="tracking-[12px] font-black text-sm">SANITY LEAKAGE</h1>

<div class="flex gap-5 text-xl">
<button>☰</button>
<button>♡</button>
<button onclick="toggleCart()">🛒</button>
</div>

</header>

<!-- RUNWAY INTRO -->
<section class="h-screen flex flex-col items-center justify-center text-center runway d1">

<img src="IMG-20260519-WA0003.jpg"
class="w-[320px] md:w-[700px] parallax">

<p class="mt-10 tracking-[18px] text-xs text-zinc-500">
RUNWAY DROP // LOOK 01
</p>

</section>

<!-- RUNWAY LOOK 1 -->
<section class="h-screen flex flex-col items-center justify-center text-center runway d2">

<img src="IMG-20260519-WA0006.jpg"
class="w-[85vw] md:w-[600px] h-[650px] object-cover rounded-[40px] shadow-2xl">

<p class="mt-8 text-xl font-light tracking-[6px]">
STRUCTURAL WIND BREAKER
</p>

</section>

<!-- RUNWAY LOOK 2 -->
<section class="h-screen flex flex-col items-center justify-center text-center runway d3">

<img src="IMG-20260520-WA0000.jpg"
class="w-[85vw] md:w-[600px] h-[650px] object-cover rounded-[40px] shadow-2xl">

<p class="mt-8 text-xl font-light tracking-[6px]">
REFLECTIVE ARCHITECTURE
</p>

<button onclick="addToCart()"
class="mt-10 bg-black text-white px-12 py-5 rounded-full tracking-[6px] uppercase font-black hover:scale-105 transition">

Add To Cart

</button>

</section>

<!-- RUNWAY END -->
<section class="h-screen bg-black text-white flex flex-col items-center justify-center text-center runway">

<h2 class="text-4xl md:text-6xl font-black max-w-4xl leading-tight">
“Not clothing — a visual interruption in reality.”
</h2>

<img src="IMG-20260519-WA0001.jpg"
class="w-28 mt-16 opacity-60">

</section>

<!-- CART -->
<div id="cart"
class="fixed top-0 right-0 w-[420px] h-full bg-black text-white p-6 translate-x-full transition duration-700 z-50 flex flex-col">

<div class="flex justify-between border-b border-white/10 pb-4">
<h2 class="font-bold tracking-[6px] uppercase">RUNWAY BAG</h2>
<button onclick="toggleCart()">X</button>
</div>

<div id="items" class="flex-1 mt-6 text-sm text-zinc-400">
Empty
</div>

</div>

<script>

let cart = [];

/* ===== RUNWAY SCROLL ENGINE ===== */
function reveal(){
const items = document.querySelectorAll('.runway');

items.forEach(el=>{
const top = el.getBoundingClientRect().top;
const trigger = window.innerHeight * 0.85;

if(top < trigger){
el.classList.add('show');
}
});
}

window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);

/* ===== CART ===== */
function addToCart(){
cart.push("Runway Windbreaker");
update();
toggleCart();
}

function update(){
document.getElementById("items").innerHTML =
cart.length ? cart.map((x,i)=>`
<div class="flex justify-between border-b border-white/10 py-2">
<p>${x}</p>
<button onclick="remove(${i})">x</button>
</div>
`).join("") : "Empty";
}

function remove(i){
cart.splice(i,1);
update();
}

function toggleCart(){
document.getElementById("cart").classList.toggle("translate-x-full");
}

update();

</script>

</body>
</html>
