<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanity Leakage — Little Species</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter;
background:black;
color:white;
overflow-x:hidden;
}

nav button{
opacity:0.5;
font-size:11px;
letter-spacing:3px;
}

nav button.active{
opacity:1;
font-weight:700;
}

.page{display:none;}
.page.active{display:block;}

.fade{
opacity:0;
transform:translateY(40px);
transition:1s ease;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

.img{
transition:0.4s;
}

.img:hover{
transform:scale(1.02);
}

::-webkit-scrollbar{display:none;}
</style>
</head>

<body>

<!-- NAV -->
<header class="flex justify-between items-center px-5 py-4 border-b border-white/10 bg-black sticky top-0 z-50">

<h1 class="font-black tracking-[8px] text-sm">SANITY LEAKAGE</h1>

<nav class="flex gap-4 md:gap-6">
<button class="active" onclick="go('home',this)">HOME</button>
<button onclick="go('shop',this)">SHOP</button>
<button onclick="go('archive',this)">ARCHIVE</button>
<button onclick="go('drop',this)">CUSTOM</button>
</nav>

</header>

<!-- HOME -->
<section id="home" class="page active px-5 pt-20 text-center">

<div class="fade show">

<!-- MAIN LOGO (ONLY LOGO USED EVERYWHERE) -->
<img src="IMG-20260519-WA0003.jpg"
class="w-[300px] md:w-[650px] mx-auto">

<p class="mt-6 text-zinc-400 tracking-[10px] text-xs">
LITTLE DIFFERENT SPECIES
</p>

<p class="mt-6 text-sm text-zinc-500">
“Built for those who exist outside the system.”
</p>

</div>

</section>

<!-- SHOP -->
<section id="shop" class="page px-5 pt-20 text-center">

<div class="fade">

<h2 class="text-4xl font-black">SHOP</h2>

<div class="flex flex-col md:flex-row gap-6 justify-center mt-10">

<img src="IMG-20260519-WA0006.jpg" class="img w-full md:w-[45%] rounded-2xl">
<img src="IMG-20260520-WA0000.jpg" class="img w-full md:w-[45%] rounded-2xl">

</div>

<h3 class="mt-8 text-2xl">Reflective Windbreaker</h3>
<p class="text-zinc-400">R950</p>

<button onclick="addToCart()"
class="mt-6 bg-white text-black px-10 py-4 rounded-full font-black">
Add To Cart
</button>

</div>

</section>

<!-- ARCHIVE + RATINGS -->
<section id="archive" class="page px-5 pt-20 text-center">

<div class="fade">

<h2 class="text-4xl font-black">ARCHIVE</h2>

<div class="flex gap-6 overflow-x-auto mt-10">

<img src="IMG-20260519-WA0006.jpg" class="img w-[80vw] md:w-[500px] rounded-xl">
<img src="IMG-20260520-WA0000.jpg" class="img w-[80vw] md:w-[500px] rounded-xl">

</div>

<!-- REVIEWS -->
<div class="mt-12 max-w-3xl mx-auto text-left">

<h3 class="text-xl font-bold mb-4">Customer Reviews</h3>

<div id="reviews" class="space-y-3"></div>

</div>

<!-- RATING SYSTEM -->
<div class="mt-12 max-w-xl mx-auto text-left">

<h3 class="text-xl font-bold mb-4">Rate Experience</h3>

<input id="rateEmail" placeholder="Your email"
class="w-full p-3 rounded-full text-black mb-3">

<select id="rating" class="w-full p-3 rounded-full text-black mb-3">
<option value="5">★★★★★</option>
<option value="4">★★★★</option>
<option value="3">★★★</option>
<option value="2">★★</option>
<option value="1">★</option>
</select>

<button onclick="submitRating()"
class="w-full bg-white text-black py-3 rounded-full font-black">
Submit Rating
</button>

</div>

</div>

</section>

<!-- CUSTOM (BLACK + APPROVAL SYSTEM) -->
<section id="drop" class="page px-5 pt-20 text-center">

<div class="fade">

<h2 class="text-4xl font-black">CUSTOM DESIGN STUDIO</h2>

<p class="text-zinc-500 mt-2">We build identity pieces on request</p>

<div class="mt-10 max-w-xl mx-auto text-left">

<input id="email" placeholder="Gmail"
class="w-full p-4 rounded-full text-black mb-4">

<textarea id="design" placeholder="Describe your design..."
class="w-full p-4 rounded-xl text-black h-32"></textarea>

<button onclick="sendCustom()"
class="w-full mt-5 bg-white text-black py-4 rounded-full font-black">
Submit Request
</button>

</div>

<!-- STATUS ANIMATION -->
<div id="statusBox" class="mt-10 hidden">
<p id="statusText" class="text-sm text-zinc-400"></p>
<div class="w-full h-1 bg-white/10 mt-3">
<div id="statusBar" class="h-full bg-white w-0 transition-all duration-700"></div>
</div>
</div>

</div>

</section>

<script>

/* NAV FIX */
function go(page,el){

document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(page).classList.add('active');

document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
if(el) el.classList.add('active');

}

/* CART */
let cart=[];
function addToCart(){
cart.push("Windbreaker");
}

/* REVIEWS */
function submitRating(){

let email=document.getElementById("rateEmail").value;
let rating=document.getElementById("rating").value;

if(!email) return;

let review=document.createElement("div");
review.className="border border-white/10 p-3 rounded-xl";
review.innerText=`${email} rated ${"★".repeat(rating)}${"☆".repeat(5-rating)}`;

document.getElementById("reviews").prepend(review);

document.getElementById("rateEmail").value="";

}

/* CUSTOM APPROVAL SYSTEM */
function sendCustom(){

let email=document.getElementById("email").value;
let design=document.getElementById("design").value;

if(!email||!design){alert("Fill all");return;}

let box=document.getElementById("statusBox");
let text=document.getElementById("statusText");
let bar=document.getElementById("statusBar");

box.classList.remove("hidden");

text.innerText="Submitting...";
bar.style.width="25%";

setTimeout(()=>{
text.innerText="Analyzing design...";
bar.style.width="55%";
},1200);

setTimeout(()=>{
text.innerText="Reviewing...";
bar.style.width="85%";
},2400);

setTimeout(()=>{
text.innerText="Request received ✓";
bar.style.width="100%";
},3600);

}

document.querySelectorAll('.fade').forEach(f=>f.classList.add('show'));

</script>
  
<img src="IMG-20260519-WA0003.jpg"
class="w-[50px] md:w-[65px] mx-auto">
  
</body>
</html>
