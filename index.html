<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanity Leakage | Little Species</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
}

body{
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

/* SPLIT THEME */
.top-half{
background:white;
color:black;
}

.bottom-half{
background:black;
color:white;
}

/* SMOOTH */
html{
scroll-behavior:smooth;
}

/* CART */
.drawer{
transition:0.5s ease;
}

/* BUTTON */
.btn{
transition:0.4s ease;
}

.btn:hover{
transform:scale(1.03);
}

/* SWIPE */
.slider{
scroll-snap-type:x mandatory;
overflow-x:auto;
display:flex;
}

.slide{
scroll-snap-align:center;
flex:none;
}

::-webkit-scrollbar{
display:none;
}

</style>
</head>

<body>

<!-- TOP HALF -->
<section class="top-half min-h-screen relative">

<!-- NAV -->
<div class="flex justify-between items-center px-6 py-6 border-b border-black/10">

<h1 class="font-black tracking-[6px] text-sm">
SANITY LEAKAGE
</h1>

<div class="flex gap-4 items-center">

<button onclick="toggleFav()">♡</button>

<button onclick="toggleCart()" class="relative">
🛒
<span id="count" class="absolute -top-2 -right-2 bg-black text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
</button>

</div>

</div>

<!-- HERO LOGO (BLACK ONLY) -->
<div class="text-center py-20">

<img src="IMG-20260519-WA0003.jpg"
class="w-[280px] md:w-[600px] mx-auto">

<p class="tracking-[10px] text-xs mt-8">
EXCLUSIVE STREETWEAR DROP
</p>

</div>

<!-- PRODUCT SWIPE -->
<div class="px-6">

<div class="slider gap-6" id="slider">

<!-- IMAGE 1 (WHITE DESIGN) -->
<div class="slide w-[90vw] md:w-[600px]">
<img src="IMG_20260520_150513.jpg" class="rounded-[30px] w-full h-[600px] object-cover">
</div>

<!-- IMAGE 2 (BLACK DESIGN) -->
<div class="slide w-[90vw] md:w-[600px]">
<img src="IMG_20260520_150529.jpg" class="rounded-[30px] w-full h-[600px] object-cover">
</div>

</div>

</div>

<!-- PRODUCT INFO -->
<div class="text-center py-16">

<h2 class="text-4xl font-black uppercase">
Reflective Jacket
</h2>

<p class="mt-4 text-zinc-500">
R950 • One Product Only
</p>

<button onclick="addToCart()"
class="mt-8 bg-black text-white px-10 py-4 rounded-full uppercase tracking-[4px] btn">
Add To Cart
</button>

</div>

</section>

<!-- BOTTOM HALF -->
<section class="bottom-half py-32 px-6 text-center">

<!-- QUOTE -->
<h2 class="text-3xl md:text-5xl font-black leading-tight">
“Made for the ones who were never meant to fit in.”
</h2>

<!-- SMALL BLACK LOGO -->
<div class="mt-20">
<img src="IMG-20260519-WA0001.jpg"
class="w-28 mx-auto opacity-50">
</div>

<!-- CONTACT -->
<div class="mt-20">

<p class="text-zinc-500 text-sm mb-6">
Contact to order via Gmail only
</p>

<a href="mailto:Cruzaliancy@gmail.com?subject=Sanity%20Leakage%20Order"
class="bg-white text-black px-10 py-5 rounded-full uppercase tracking-[4px] font-black btn inline-block">

Order Now

</a>

</div>

</section>

<!-- CART DRAWER -->
<div id="cart" class="drawer fixed top-0 right-0 w-[400px] h-full bg-black text-white p-6 translate-x-full border-l border-white/10">

<div class="flex justify-between items-center border-b border-white/10 pb-4">

<h2 class="font-bold uppercase tracking-[4px]">Basket</h2>

<button onclick="toggleCart()">X</button>

</div>

<div id="cartItems" class="mt-6 text-sm text-zinc-400">
Empty
</div>

<div class="absolute bottom-6 left-0 w-full px-6">

<a id="checkout"
href="mailto:Cruzaliancy@gmail.com?subject=Order"
class="bg-white text-black w-full block text-center py-4 rounded-full font-black uppercase tracking-[3px]">

Checkout via Gmail

</a>

</div>

</div>

<script>

let cart = [];

function toggleCart(){
document.getElementById("cart").classList.toggle("translate-x-full");
}

function addToCart(){

cart.push("Reflective Jacket");

document.getElementById("count").innerText = cart.length;

document.getElementById("cartItems").innerHTML =
cart.map(item => `<p>• ${item}</p>`).join("");

toggleCart();
}

function toggleFav(){
alert("Added to favorites ♡");
}

</script>

</body>
</html>
